<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система за Присъствия</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hidden { display: none !important; }
        body { background-color: #f8f9fa; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4">IoT Система за Присъствия</h2>

    <div id="loginSection" class="card mx-auto" style="max-width: 400px;">
        <div class="card-body">
            <h5 class="card-title text-center">Вход</h5>
            <form id="loginForm">
                <div class="mb-3">
                    <label>Потребител</label>
                    <input type="text" id="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Парола</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Влез</button>
                <div id="loginError" class="text-danger mt-2 hidden">Грешни данни!</div>
            </form>
        </div>
    </div>

    <div id="dashboardSection" class="hidden">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 id="welcomeMessage">Добре дошли</h4>
            <div>
                <button id="showCurriculumBtn" class="btn btn-primary hidden" onclick="showCurriculum()">Учебен план</button>
                <button id="showCreateUserBtn" class="btn btn-dark hidden me-2">Създай потребител</button>
                <button id="logoutBtn" class="btn btn-outline-danger">Изход</button>
            </div>
        </div>

        <div id="attendanceView">
            <div id="teacherControls" class="card mb-4 hidden">
                <div class="card-header bg-success text-white">Управление на присъствия</div>
                <div class="card-body">
                    <form id="addAttendanceForm" class="row g-3 align-items-end">
                        <div class="col-auto">
                            <label>ID Студент</label>
                            <input type="number" id="addStudentId" class="form-control" required>
                        </div>
                        <div class="col-auto">
                            <label>ID Разписание</label>
                            <input type="number" id="addScheduleId" class="form-control" required>
                        </div>
                        <div class="col-auto">
                            <label>Статус</label>
                            <select id="addStatus" class="form-select">
                            <option value="present">Присъствие</option>
                            <option value="makeup">Отработване</option>
                            <option value="excused">Извинено</option>
                        </select>
                        </div>
                        <div class="col-auto">
                            <button type="submit" class="btn btn-success">Добави ръчно</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Записи на присъствия</div>
                <div class="card-body">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Дата и час</th>
                                <th>Студент (ID)</th>
                                <th>Занятие (ID)</th>
                                <th>Статус</th>
                                <th>Източник на записа</th> <th id="actionColumn" class="hidden">Действия</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="createUserView" class="card mb-4 hidden">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span>Бърза регистрация на нови лица</span>
                <button id="backToDashboardBtn" class="btn btn-sm btn-outline-light">Назад към присъствията</button>
            </div>
            <div class="card-body">
                <div class="mb-3 col-md-4">
                    <label class="fw-bold">Стъпка 1: Изберете какъв профил създавате</label>
                    <select id="clerkRoleSelector" class="form-select bg-light fw-bold">
                        <option value="student">Нов Студент</option>
                        <option value="teacher">Нов Преподавател</option>
                        <option value="admin">Нов Администратор</option>
                    </select>
                </div>
                
                <hr>

                <form id="clerkRegistrationForm" class="row g-3">
                    <div class="col-md-6">
                        <label>Три имена</label>
                        <input type="text" id="clerkName" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label>Потребителско име (за вход)</label>
                        <input type="text" id="clerkUsername" class="form-control" placeholder="напр. fnum12345" required>
                    </div>
                    <div class="col-md-3">
                        <label>Парола</label>
                        <input type="password" id="clerkPassword" class="form-control" required>
                    </div>

                    <div id="clerkStudentFields" class="row g-3 mt-1 p-0 m-0">
                        <div class="col-md-3">
                            <label class="text-primary">Факултетен номер</label>
                            <input type="text" id="clerkFacultyNumber" class="form-control border-primary">
                        </div>
                        <div class="col-md-3">
                            <label class="text-primary">Код на RFID карта / чип</label>
                            <input type="text" id="clerkRfidUid" class="form-control border-primary" placeholder="Сканирайте карта">
                        </div>
                        <div class="col-md-2">
                            <label class="text-primary">Група</label>
                            <input type="text" id="clerkGroupName" class="form-control border-primary">
                        </div>
                        <div class="col-md-2">
                            <label class="text-primary">Курс</label>
                            <select id="clerkGroupYear" class="form-select border-primary">
                                <option value="1">1 курс</option>
                                <option value="2">2 курс</option>
                                <option value="3">3 курс</option>
                                <option value="4">4 курс</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="text-primary">Специалност</label>
                            <input type="text" id="clerkGroupMajor" class="form-control border-primary" placeholder="напр. КСТ">
                        </div>
                    </div>

                    <div id="clerkTeacherFields" class="row g-3 mt-1 p-0 m-0 hidden">
                        <div class="col-md-6">
                            <label class="text-success">Академична длъжност</label>
                            <input type="text" id="clerkTitle" class="form-control border-success" placeholder="напр. Доц. д-р">
                        </div>
                        <div class="col-md-6">
                            <label class="text-success">Катедра</label>
                            <input type="text" id="clerkDepartment" class="form-control border-success" placeholder="напр. КСТ">
                        </div>
                    </div>

                    <div class="col-12 mt-4">
                        <button type="submit" class="btn btn-dark btn-lg w-100">Въведи в системата</button>
                    </div>
                </form>
            </div>
        </div>
        <div id="curriculumView" class="mb-4 hidden">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0">Управление на учебния план</h3>
                <button onclick="showDashboard()" class="btn btn-outline-dark">Назад към присъствията</button>
            </div>
            
            <div class="row mt-2">
                <div class="col-md-4">
                    <div class="card border-dark h-100">
                        <div class="card-header bg-dark text-white fw-bold">1. Нов Предмет</div>
                        <div class="card-body">
                            <form id="createCourseForm">
                                <div class="mb-2">
                                    <label>Име на предмета</label>
                                    <input type="text" id="courseName" class="form-control" placeholder="напр. Компютърни Мрежи" required>
                                </div>
                                <button type="submit" class="btn btn-dark w-100 btn-sm mt-2">Добави предмет</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-secondary h-100">
                        <div class="card-header bg-secondary text-white fw-bold">2. Зачисляване към Група</div>
                        <div class="card-body">
                            <form id="createGroupCourseForm">
                                <div class="mb-2">
                                    <label>ID на Групата</label>
                                    <input type="number" id="gcGroupId" class="form-control" required>
                                </div>
                                <div class="mb-2">
                                    <label>ID на Предмета</label>
                                    <input type="number" id="gcCourseId" class="form-control" required>
                                </div>
                                <div class="mb-2">
                                    <label>ID на Преподавателя (Опционално)</label>
                                    <input type="number" id="gcTeacherId" class="form-control">
                                </div>
                                <div class="mb-2">
                                    <label>Тип занятие</label>
                                    <select id="gcType" class="form-select">
                                        <option value="lecture">Лекция</option>
                                        <option value="exercise">Упражнение</option>
                                        <option value="lab">Лабораторно упражнение</option>
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-secondary w-100 btn-sm mt-2">Зачисли предмет</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-primary h-100">
                        <div class="card-header bg-primary text-white fw-bold">3. Добавяне в Графика</div>
                        <div class="card-body">
                            <form id="createScheduleForm">
                                <div class="row g-2">
                                    <div class="col-md-6 mb-2">
                                        <label>GroupCourse ID</label>
                                        <input type="number" id="schedGcId" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-2">
                                        <label>Зала номер</label>
                                        <input type="text" id="schedRoom" class="form-control" placeholder="напр. 3225" required>
                                    </div>
                                </div>
                                <div class="row g-2">
                                    <div class="col-md-6 mb-2">
                                        <label>Ден</label>
                                        <select id="schedDay" class="form-select">
                                            <option value="0">Понеделник</option>
                                            <option value="1">Вторник</option>
                                            <option value="2">Сряда</option>
                                            <option value="3">Четвъртък</option>
                                            <option value="4">Петък</option>
                                            <option value="5">Събота</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-2">
                                        <label>Подгрупа</label>
                                        <select id="schedSubgroup" class="form-select">
                                            <option value="">Цялата (Лекция)</option>
                                            <option value="A">Подгрупа А</option>
                                            <option value="B">Подгрупа Б</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row g-2">
                                    <div class="col-md-6 mb-2">
                                        <label>Начало</label>
                                        <input type="time" id="schedStartTime" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-2">
                                        <label>Край</label>
                                        <input type="time" id="schedEndTime" class="form-control" required>
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label>Цикличност</label>
                                    <select id="schedParity" class="form-select">
                                        <option value="all">Всяка седмица</option>
                                        <option value="odd">През седмица - Нечетна</option>
                                        <option value="even">През седмица - Четна</option>
                                    </select>
                                </div>
                                <div class="row g-2">
                                    <div class="col-md-6 mb-2">
                                        <label>От дата</label>
                                        <input type="date" id="schedStartDate" class="form-control" required>
                                    </div>
                                    <div class="col-md-6 mb-2">
                                        <label>До дата</label>
                                        <input type="date" id="schedEndDate" class="form-control" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 btn-sm mt-2">Запиши в графика</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>
</div>

<script>
    const API_BASE = "http://localhost:8000";
    let token = localStorage.getItem("token");
    let userRole = null;

    // Помощна функция за декодиране на JWT
    function parseJwt(token) {
        try {
            return JSON.parse(atob(token.split('.')[1]));
        } catch (e) {
            return null;
        }
    }

    // Проверка на състоянието при зареждане
    function checkAuthState() {
        if (token) {
            const payload = parseJwt(token);
            if (payload) {
                userRole = payload.role;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.getElementById('welcomeMessage').innerText = `Здравей, ${payload.sub} (${userRole})`;
                
                if (userRole === 'teacher' || userRole === 'admin') {
                    document.getElementById('teacherControls').classList.remove('hidden');
                    document.getElementById('actionColumn').classList.remove('hidden');
                }
                if (userRole === 'admin') {
                    document.getElementById('showCreateUserBtn').classList.remove('hidden');
                    document.getElementById('showCurriculumBtn').classList.remove('hidden');
                }
                loadAttendance();
            } else {
                logout();
            }
        }
    }

    // Логин логика
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append("username", document.getElementById('username').value);
        formData.append("password", document.getElementById('password').value);

        try {
            const response = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const data = await response.json();
                token = data.access_token;
                localStorage.setItem("token", token);
                document.getElementById('loginError').classList.add('hidden');
                checkAuthState();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        } catch (err) {
            console.error("Грешка при връзка със сървъра", err);
        }
    });

    // Извличане на присъствията
    async function loadAttendance() {
    try {
        const response = await fetch(`${API_BASE}/attendance`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        
        const tbody = document.getElementById('attendanceTableBody');
        tbody.innerHTML = ''; // Изчистваме старите редове

        data.forEach(att => {
            const tr = document.createElement('tr');
            let statusBadge = '';
            if (att.status === 'present') {
                statusBadge = '<span class="badge bg-success">Присъствие</span>';
            } else if (att.status === 'makeup') {
                statusBadge = '<span class="badge bg-warning text-dark">Отработване</span>';
            } else if (att.status === 'excused') {
                statusBadge = '<span class="badge bg-info text-dark">Служебно / Извинено</span>';
            } else {
                statusBadge = `<span class="badge bg-secondary">${att.status}</span>`;
            }

            let sourceMark = '';
            if (att.recorded_by === 'Автоматичен') {
                sourceMark = '<strong class="text-primary">🤖 Автоматичен (RFID)</strong>';
            } else {
                sourceMark = `<span class="text-muted">✍️ Ръчно от: <strong>${att.recorded_by}</strong></span>`;
            }

            const formattedDate = new Date(att.timestamp).toLocaleString('bg-BG');

            tr.innerHTML = `
                <td>${formattedDate}</td>
                <td>${att.student_id}</td>
                <td>${att.schedule_id}</td>
                <td>${statusBadge}</td>
                <td>${sourceMark}</td> <td class="${userRole === 'teacher' ? '' : 'hidden'}">
                    <button class="btn btn-sm btn-danger" onclick="deleteRecord(${att.id})">Изтрий</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    } catch (err) {
        console.error("Грешка при зареждане на присъствията:", err);
    }
}

    // Ръчно добавяне на присъствие
    document.getElementById('addAttendanceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const studentId = document.getElementById('addStudentId').value;
        const scheduleId = document.getElementById('addScheduleId').value;
        const status = document.getElementById('addStatus').value;

        // POST заявка с query параметри
        const url = `${API_BASE}/attendance?student_id=${studentId}&schedule_id=${scheduleId}&status=${status}`;
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                loadAttendance();
                document.getElementById('addAttendanceForm').reset();
            } else {
                const err = await response.json();
                alert(`Грешка: ${err.detail}`);
            }
        } catch (err) {
            console.error(err);
        }
    });

    // Изтриване на присъствие
    async function deleteAttendance(id) {
        if (!confirm("Сигурни ли сте, че искате да изтриете този запис?")) return;
        try {
            const response = await fetch(`${API_BASE}/attendance/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (response.ok) {
                loadAttendance();
            } else {
                const err = await response.json();
                alert(`Грешка: ${err.detail}`);
            }
        } catch (err) {
            console.error(err);
        }
    }

    // --- НАВИГАЦИЯ ЗА АДМИН ---
    document.getElementById('showCreateUserBtn')?.addEventListener('click', () => {
        document.getElementById('attendanceView').classList.add('hidden');
        document.getElementById('createUserView').classList.remove('hidden');
    });

    document.getElementById('backToDashboardBtn')?.addEventListener('click', () => {
        document.getElementById('createUserView').classList.add('hidden');
        document.getElementById('attendanceView').classList.remove('hidden');
    });

    // --- СЪЗДАВАНЕ НА ПОТРЕБИТЕЛ ---

    //     e.preventDefault();

    //     const password = document.getElementById('newPassword').value;

    //             headers: {

    //                 'Authorization': `Bearer ${token}`

    //             alert(`Успех: Потребителят "${username}" е създаден!`);

    //             // Автоматично връщане към основния изглед

    //         }
    //     } catch (err) {
    //         console.error("Грешка при връзка:", err);
    //     }
    // });
    // Динамична промяна на полетата във формата спрямо избраната роля
    document.getElementById('clerkRoleSelector')?.addEventListener('change', (e) => {
        const role = e.target.value;
        const nameField = document.getElementById('clerkName');
        
        if (role === 'student') {
            document.getElementById('clerkStudentFields').classList.remove('hidden');
            document.getElementById('clerkTeacherFields').classList.add('hidden');
            nameField.parentElement.classList.remove('hidden'); // Показваме Името
            nameField.required = true;
        } else if (role === 'teacher') {
            document.getElementById('clerkStudentFields').classList.add('hidden');
            document.getElementById('clerkTeacherFields').classList.remove('hidden');
            nameField.parentElement.classList.remove('hidden'); // Показваме Името
            nameField.required = true;
        } else if (role === 'admin') {
            document.getElementById('clerkStudentFields').classList.add('hidden');
            document.getElementById('clerkTeacherFields').classList.add('hidden');
            nameField.parentElement.classList.add('hidden');
            nameField.required = false;
        }
    });
    // Изпращане на единната форма към бекенда
    document.getElementById('clerkRegistrationForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const selectedRole = document.getElementById('clerkRoleSelector').value;
        const name = document.getElementById('clerkName').value;
        const username = document.getElementById('clerkUsername').value;
        const password = document.getElementById('clerkPassword').value;

        let url = `${API_BASE}/register/student`;
        let bodyData = { username, password, name };

        if (selectedRole === 'student') {
            url = `${API_BASE}/auth/register/student`;
            bodyData.name = document.getElementById('clerkName').value;
            bodyData.faculty_number = document.getElementById('clerkFacultyNumber').value;
            bodyData.rfid_uid = document.getElementById('clerkRfidUid').value;
            
            // Новите групови полета
            bodyData.group_name = document.getElementById('clerkGroupName').value;
            bodyData.group_year = parseInt(document.getElementById('clerkGroupYear').value);
            bodyData.group_major = document.getElementById('clerkGroupMajor').value.toUpperCase(); // Автоматично прави КСТ главни букви
            
            if(!bodyData.faculty_number || !bodyData.rfid_uid || !bodyData.group_name || !bodyData.group_major) {
                alert("Моля, попълнете всички студентски полета!");
                return;
            }
        } else if (selectedRole === 'teacher') {
            url = `${API_BASE}/auth/register/teacher`;
            bodyData.name = document.getElementById('clerkName').value;
            bodyData.title = document.getElementById('clerkTitle').value || null; // Взимаме титлата
            bodyData.department = document.getElementById('clerkDepartment').value || null;
            if (!bodyData.name) {
                alert("Моля, въведете три имена на преподавателя!");
                return;
            }
        } else if (selectedRole === 'admin') {
            url = `${API_BASE}/auth/register/admin`;
        }

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify(bodyData)
            });

            const result = await response.json();

            if (response.ok) {
                alert(result.detail);
                document.getElementById('clerkRegistrationForm').reset();
                // Връщане обратно към главния екран
                document.getElementById('createUserView').classList.add('hidden');
                document.getElementById('attendanceView').classList.remove('hidden');
                loadAttendance();
            } else {
                alert(`Грешка: ${result.detail}`);
            }
        } catch (err) {
            console.error("Възникна грешка при комуникацията:", err);
        }
    });

    document.getElementById('createGroupCourseForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const bodyData = {
            group_id: parseInt(document.getElementById('gcGroupId').value),
            course_id: parseInt(document.getElementById('gcCourseId').value),
            teacher_id: document.getElementById('gcTeacherId').value ? parseInt(document.getElementById('gcTeacherId').value) : null,
            type: document.getElementById('gcType').value
        };

        try {
            const response = await fetch(`${API_BASE}/admin/group-courses`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify(bodyData)
            });
            const result = await response.json();
            alert(response.ok ? result.detail : `Грешка: ${result.detail}`);
            if(response.ok) document.getElementById('createGroupCourseForm').reset();
        } catch (err) {
            console.error(err);
        }
    });
    document.getElementById('createScheduleForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
            const bodyData = {
            group_course_id: parseInt(document.getElementById('schedGcId').value),
            room_number: document.getElementById('schedRoom').value,
            day_of_week: parseInt(document.getElementById('schedDay').value),
            start_time: document.getElementById('schedStartTime').value,
            end_time: document.getElementById('schedEndTime').value,
            week_parity: document.getElementById('schedParity').value,
            start_date: document.getElementById('schedStartDate').value,
            end_date: document.getElementById('schedEndDate').value,
            subgroup: document.getElementById('schedSubgroup').value || null
        };

        try {
            const response = await fetch(`${API_BASE}/admin/schedules`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify(bodyData)
            });
            const result = await response.json();
            alert(response.ok ? result.detail : `Грешка: ${result.detail}`);
            if(response.ok) document.getElementById('createScheduleForm').reset();
        } catch (err) {
            console.error(err);
        }
    });
    document.getElementById('createCourseForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
            const bodyData = {
            name: document.getElementById('courseName').value
        };

        try {
            const response = await fetch(`${API_BASE}/admin/courses`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify(bodyData)
            });
            const result = await response.json();
            alert(response.ok ? result.detail : `Грешка: ${result.detail}`);
            if(response.ok) document.getElementById('createCourseForm').reset();
        } catch (err) {
            console.error(err);
        }
    });
    
    function showCurriculum() {
        document.getElementById('attendanceView').classList.add('hidden');
        document.getElementById('curriculumView').classList.remove('hidden');
    }

    // За да работи бутонът "Назад към присъствията"
    function showDashboard() {
        document.getElementById('curriculumView').classList.add('hidden');
        document.getElementById('createUserView').classList.add('hidden');
        document.getElementById('attendanceView').classList.remove('hidden');
        loadAttendance();
    }

    // Изход
    document.getElementById('logoutBtn').addEventListener('click', logout);
    function logout() {
        token = null;
        userRole = null;
        localStorage.removeItem("token");
        document.getElementById('dashboardSection').classList.add('hidden');
        document.getElementById('loginSection').classList.remove('hidden');
        document.getElementById('loginForm').reset();
        document.getElementById('showCreateUserBtn')?.classList.add('hidden');
        document.getElementById('teacherControls')?.classList.add('hidden');
        document.getElementById('actionColumn')?.classList.add('hidden');
        document.getElementById('createUserView')?.classList.add('hidden');
        document.getElementById('attendanceView')?.classList.remove('hidden');
        document.getElementById('showCurriculumBtn')?.classList.add('hidden');
    }

    // Инициализация
    checkAuthState();
</script>
</body>
